<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hive" />
    <meta name="description" content="DPMS - Department Project Management System" />
    <link id="app-favicon" rel="icon" type="image/png" href="/LightModeLogo.png" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/LightModeLogo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Hive - Department Management System</title>
    <!-- Google Fonts: Inter (preconnected for fast load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100;0,14..32,200;0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,300;1,14..32,400;1,14..32,500;1,14..32,600;1,14..32,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("dpms_theme");
          var isDark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          }
        } catch(e) {}

        function updateFavicon() {
          var isDark = document.documentElement.classList.contains("dark");
          var iconPath = isDark ? "/DarkModeLogo.png" : "/LightModeLogo.png";
          var fav = document.getElementById("app-favicon");
          var touch = document.getElementById("app-apple-touch-icon");
          if (fav) fav.href = iconPath;
          if (touch) touch.href = iconPath;
        }

        window.addEventListener("DOMContentLoaded", updateFavicon);
        var observer = new MutationObserver(updateFavicon);
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
